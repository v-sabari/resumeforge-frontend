name: Bug Report
description: Report a bug in ResumeForge AI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: If applicable, add screenshots or console/network logs.

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 126 on macOS 15

  - type: textarea
    id: additional
    attributes:
      label: Additional context
